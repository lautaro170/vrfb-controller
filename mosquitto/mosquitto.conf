# General settings
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# Listener for the local Docker network and the edge device.
# Anonymous access is enabled for the local test phase; it must be disabled
# and a password_file must be configured before exposing 1883 to the internet.
listener 1883
allow_anonymous true
# password_file /mosquitto/config/passwords

# Include the bridging rules IT WILL BE USED WHEN CONFIGURING BRIDGING TO THE CLOUDs
# include_dir /mosquitto/config/conf.d
