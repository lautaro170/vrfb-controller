version: '3.8'

services:
  # --- POSTGRES DATABASE ---
  postgres:
    image: postgres:16-alpine
    container_name: vrfb-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vrfb
      - POSTGRES_USER=vrfb
      - POSTGRES_PASSWORD=vrfb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- MQTT BROKER ---
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: vrfb-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
#     - ./mosquitto/bridge.conf:/mosquitto/config/conf.d/bridge.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # --- NODE.JS API & WEBSOCKETS ---
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: vrfb-api
    restart: unless-stopped
    depends_on:
      - mosquitto
      - postgres
    ports:
      - "3000:3000"
    environment:
      - MQTT_URL=mqtt://mosquitto:1883
      - DATABASE_URL=postgresql://vrfb:vrfb@postgres:5432/vrfb
      - API_KEY=change-this-api-key
      - NODE_ENV=production

  # --- REACT DASHBOARD (NGINX) ---
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: vrfb-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log: