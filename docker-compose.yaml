services:
  # --- POSTGRES DATABASE ---
  postgres:
    image: postgres:16
    container_name: vrfb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vrfb
      POSTGRES_USER: vrfb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Only exposed on localhost for debugging; not reachable from the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrfb -d vrfb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MQTT BROKER ---
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: vrfb-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # Uncomment the next line when enabling broker authentication.
      # - ./mosquitto/passwords:/mosquitto/config/passwords:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # --- NODE.JS API & WEBSOCKETS ---
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: vrfb-api
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      # Only exposed on localhost for debugging; the web container proxies traffic.
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      MQTT_URL: "mqtt://mosquitto:1883"
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      DATABASE_URL: "postgresql://vrfb:${POSTGRES_PASSWORD}@postgres:5432/vrfb"
      API_KEY: ${API_KEY}
      NODE_ENV: "production"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}

  # --- REACT DASHBOARD (NGINX) ---
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: vrfb-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
